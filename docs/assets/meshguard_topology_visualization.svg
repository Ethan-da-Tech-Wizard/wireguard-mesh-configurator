    <text x="24" y="256">Node Name        Overlay IP         Endpoint               Role</text>
    <text x="24" y="278">──────────────────────────────────────────────────────────────────────</text>
    <text x="24" y="300">gateway-node     127.0.0.1.1/24      vpn.example.com:51820  Hub (Relay)</text>
    <text x="24" y="322">worker-01        127.0.0.1.2/24      198.51.100.12:51821    Spoke (Peer)</text>
    <text x="24" y="344">worker-02        127.0.0.1.3/24      198.51.100.13:51822    Spoke (Peer)</text>
