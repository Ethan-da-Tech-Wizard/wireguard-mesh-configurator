    <text x="24" y="564">    gateway-node   ◄══════ (Direct P2P Encrypted UDP) ══════► worker-01</text>
    <text x="24" y="586">    gateway-node   ◄══════ (Direct P2P Encrypted UDP) ══════► worker-02</text>
